# Integración continua (RF de calidad RNF-11 y RNF-12): estilo, pruebas con cobertura y auditoría de dependencias.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Estilo y complejidad (ESLint)
        run: npm run lint
      - name: Pruebas unitarias e integración con cobertura mínima de 70 %
        run: npm test
      - name: Auditoría de dependencias (OWASP A06)
        run: npm audit --audit-level=high
